name: SAMCO · build y pruebas en IBM i

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ibmi:
    # Runner propio en la red local (tu Mac): no se abre ningún puerto a internet
    runs-on: self-hosted
    env:
      IBMI_HOST: ${{ vars.IBMI_HOST }}   # IP o nombre del IBM i en la LAN
      IBMI_USER: ${{ vars.IBMI_USER }}   # usuario dedicado, p. ej. CIBUILD
      IBMI_LIB: ${{ vars.IBMI_LIB }}     # biblioteca de compilación: OSWLABBOB
      REMOTE_DIR: /home/${{ vars.IBMI_USER }}/builds/samco
      SSH_KEY: ~/.ssh/ibmi_actions
      IBMI_PATH: /QOpenSys/pkgs/bin:/QOpenSys/usr/bin:/usr/ccs/bin:/usr/bin
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Copiar las fuentes al IFS del IBM i
        run: |
          ssh -i "$SSH_KEY" "$IBMI_USER@$IBMI_HOST" "mkdir -p $REMOTE_DIR"
          rsync -az --delete --exclude '.git' \
            -e "ssh -i $SSH_KEY" \
            --rsync-path=/QOpenSys/pkgs/bin/rsync \
            ./SAMCO/ "$IBMI_USER@$IBMI_HOST:$REMOTE_DIR/"
          ssh -i "$SSH_KEY" "$IBMI_USER@$IBMI_HOST" \
            "/QOpenSys/pkgs/bin/bash -c 'find $REMOTE_DIR/qtestsrc -name \"*.rpgle\" | while read f; do attr \"\$f\" CCSID=1208; done'"

      - name: Compilar con makei
        run: |
          ssh -i "$SSH_KEY" "$IBMI_USER@$IBMI_HOST" \
            "/QOpenSys/pkgs/bin/bash -c 'export PATH=/QOpenSys/pkgs/bin:/QOpenSys/usr/bin:/usr/ccs/bin:/usr/bin && cd $REMOTE_DIR && lib1=$IBMI_LIB /QOpenSys/pkgs/bin/makei build'"

      - name: Compilar y ejecutar pruebas RPGUnit · LOG300
        run: |
          # Escribe el script localmente y lo sube con scp para evitar problemas de escaping
          cat > /tmp/run_tests_local.sh << LOCALEOF
          export PATH=/QOpenSys/pkgs/bin:/QOpenSys/usr/bin:/usr/ccs/bin:/usr/bin
          RDIR=\$(cd $REMOTE_DIR && pwd -P)
          echo "RDIR resuelto: \$RDIR"
          liblist -a RPGUNIT
          liblist -a $IBMI_LIB
          echo "=== Verificando acceso al archivo desde este job ==="
          cat "\$RDIR/qtestsrc/log300.test.rpgle" | head -3
          echo "=== Compilando test con RUCRTRPG SRCSTMF via qsh ==="
          qsh -c "liblist -a RPGUNIT; liblist -a $IBMI_LIB; RUCRTRPG TSTPGM($IBMI_LIB/LOG300T) SRCSTMF('\$RDIR/qtestsrc/log300.test.rpgle') INCDIR('\$RDIR/QPROTOSRC') BNDSRVPGM($IBMI_LIB/LOG)"
          RC=\$?
          echo "RC de RUCRTRPG: \$RC"
          if [ \$RC -eq 0 ]; then
            echo "=== Ejecutando pruebas ==="
            system "RUCALLTST TSTPGM($IBMI_LIB/LOG300T) DETAIL(*ALL)"
          else
            echo "ERROR: RUCRTRPG falló"
            exit 1
          fi
          LOCALEOF
          scp -i "$SSH_KEY" /tmp/run_tests_local.sh "$IBMI_USER@$IBMI_HOST:/tmp/run_tests_${{ github.run_id }}.sh"
          ssh -i "$SSH_KEY" "$IBMI_USER@$IBMI_HOST" "/QOpenSys/pkgs/bin/bash /tmp/run_tests_${{ github.run_id }}.sh"
